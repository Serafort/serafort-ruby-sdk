name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p "$HOME/.gem"
          touch "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          printf -- "---\n:github: Bearer ${GEM_HOST_API_KEY}\n" > "$HOME/.gem/credentials"
        env:
          GEM_HOST_API_KEY: ${{ secrets.GITHUB_TOKEN }}

      - name: Build gem
        run: gem build serafort.gemspec

      - name: Push to GitHub Packages
        run: gem push --key github --host https://rubygems.pkg.github.com/Serafort *.gem
